<div id="tab-batch" class="hidden flex-col gap-4 relative z-[60]">
                            <h3 class="text-lg font-bold text-slate-800">Batch Processing Mode</h3>
                            <p class="text-sm text-slate-500">Drag and drop multiple images below to process them sequentially using your current settings.</p>
                            <div class="flex gap-4 items-center mt-2">
                                <button id="batch-start-btn" onclick="startBatchProcessing()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 transition flex items-center gap-2 hidden">
                                    <i class="ph-bold ph-lightning"></i> Run Batch Upscaler
                                </button>
                                <button id="batch-add-more-btn" onclick="document.getElementById('batch-file-input').click()" class="px-6 py-3 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 rounded-xl font-bold text-sm shadow-sm transition flex items-center gap-2 hidden">
                                    <i class="ph-bold ph-plus"></i> Add More
                                </button>
                                <button id="batch-download-btn" onclick="downloadAllBatch()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-emerald-500/30 transition flex items-center gap-2 hidden">
                                    <i class="ph-bold ph-download-simple"></i> Download All Completed
                                </button>
                                <button onclick="resetBatch()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm transition flex items-center gap-2">
                                    <i class="ph-bold ph-trash"></i> Clear Queue
                                </button>
                            </div>
                        </div>
