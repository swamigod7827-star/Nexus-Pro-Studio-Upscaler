<div class="relative">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Print Resolution</label>
                                <div onclick="toggleDropdown('dpi-menu', event)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 outline-none hover:border-slate-300 focus:border-blue-500 transition-all shadow-sm cursor-pointer flex justify-between items-center group">
                                    <span id="dpi-selected-text">600 DPI (Studio Print)</span>
                                    <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-600 transition-colors pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                                <div id="dpi-menu" class="hidden absolute top-full left-0 mt-2 w-full bg-white border border-slate-100 rounded-xl shadow-xl py-2 z-[60]">
                                    <ul class="max-h-60 overflow-y-auto pro-scrollbar">
                                        <li onclick="selectOption('dpi', '72 DPI (Web Only)', this)" class="px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">72 DPI (Web Only)</li>
                                        <li onclick="selectOption('dpi', '300 DPI (Standard)', this)" class="px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">300 DPI (Standard)</li>
                                        <li onclick="selectOption('dpi', '600 DPI (Studio Print)', this)" class="px-4 py-2.5 text-sm font-bold text-blue-600 bg-blue-50 cursor-pointer transition-colors">600 DPI (Studio Print)</li>
                                        <li onclick="selectOption('dpi', '1200 DPI (Fine Art)', this)" class="px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">1200 DPI (Fine Art)</li>
                                        <li onclick="selectOption('dpi', '2400 DPI (Micro Detail)', this)" class="px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">2400 DPI (Micro Detail)</li>
                                    </ul>
                                </div>
